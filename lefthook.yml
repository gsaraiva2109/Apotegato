# Hooks de git do projeto. Instalação: veja CONTRIBUTING.md.
# O gdformat corrige a formatação sozinho e já adiciona a correção ao commit;
# o gdlint só aponta problemas. Os dois ignoram addons/ (código de terceiros).
pre-commit:
  piped: true
  commands:
    gdformat:
      priority: 1
      glob: "*.gd"
      exclude:
        - "addons/**"
      run: gdformat {staged_files}
      stage_fixed: true
    gdlint:
      priority: 2
      glob: "*.gd"
      exclude:
        - "addons/**"
      run: gdlint {staged_files}

# Depois de um pull/merge ou de trocar de branch, regenera a arte provisória (que o git
# não versiona) e reaplica a de terceiros; só baixa se o ApotegatoAssets mudou e nunca faz
# a operação falhar.
post-merge:
  commands:
    assets:
      run: bash tools/fetch_assets.sh || echo "Aviso: não baixei a arte de terceiros (sem acesso ao ApotegatoAssets?)."

post-checkout:
  commands:
    assets:
      run: bash tools/fetch_assets.sh || echo "Aviso: não baixei a arte de terceiros (sem acesso ao ApotegatoAssets?)."
