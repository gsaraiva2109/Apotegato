name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    name: Lint (GDScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar gdtoolkit
        run: pip install -r requirements-dev.txt

      # addons/ é código de terceiros (GUT) e fica de fora.
      - name: gdformat
        run: git ls-files -z '*.gd' ':!:addons/**' | xargs -0 -r gdformat --check --diff

      - name: gdlint
        run: gdlint .

  actionlint:
    name: Lint (Workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar actionlint
        id: actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12

      - name: Rodar actionlint
        run: ${{ steps.actionlint.outputs.executable }} -color

  test:
    name: Testes (Godot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Importar o projeto
        run: godot --headless --import

      - name: Verificar scripts e cenas
        run: godot --headless -s res://tools/check_project.gd

      - name: Rodar testes (GUT)
        run: godot --headless -s addons/gut/gut_cmdln.gd

  # Único check para marcar como obrigatório na proteção da main.
  status:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, actionlint, test]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Conferir resultado dos jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            if [[ $r != success ]]; then
              exit 1
            fi
          done
